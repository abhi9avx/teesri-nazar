name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 build for setup-python.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The fake device stands in for adb, so no Android SDK is needed here.
      - run: python -m unittest discover -s tests -v
